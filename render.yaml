services:
  # 1. Backend Web Service (Protected Calculation API)
  - type: web
    name: loewe-calc-api
    runtime: node
    plan: free
    rootDir: backend_webservice
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true

  # 2. Static Landing Page (UI + 2D Isobologram Plotter)
  - type: static_site
    name: calc-loewe
    plan: free
    rootDir: static_frontend
    publishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
