services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (Protected Calculation API)
  # -------------------------------------------------------------
  - type: web
    name: api-loewe-calc
    runtime: node
    plan: free
    rootDir: backend_webservice
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
    autoDeploy: true

  # -------------------------------------------------------------
  # 2. Static Landing Page (UI + 2D Isobologram Plotter)
  # -------------------------------------------------------------
  - type: web
    name: calc-loewe
    runtime: static
    rootDir: static_frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
